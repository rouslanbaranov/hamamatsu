<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summer Avenue — Open Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Dela+Gothic+One&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    background: #f3ead8;
    color: #12101f;
    font-family: "Space Grotesk", sans-serif;
  }

  .edge {
    position: absolute; inset: 0 auto 0 0; width: 8px;
    background: #1a4fbf;
  }

  .art {
    position: absolute; top: 0; right: 0;
    width: 540px; height: 630px;
    overflow: hidden;
    background: #12101f;
  }
  .art img {
    display: block; width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 48%;
  }

  .divider {
    position: absolute; top: 0; bottom: 0; left: 652px;
    width: 8px; background: #e5402f;
    z-index: 3;
  }

  .copy {
    position: absolute; top: 42px; left: 56px; bottom: 34px;
    width: 570px;
    display: flex; flex-direction: column;
  }

  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { display: block; width: 46px; height: 46px; }
  .brand__name {
    font-family: "Space Grotesk", sans-serif; font-weight: 700;
    font-size: 21px; letter-spacing: -.03em;
  }
  .brand__rule { width: 1px; height: 26px; background: rgba(18,16,31,.28); }
  .brand__album {
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 10px; letter-spacing: .17em; text-transform: uppercase;
    color: rgba(18,16,31,.62);
  }

  .eyebrow {
    margin-top: 34px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 11px; font-weight: 600; letter-spacing: .18em;
    text-transform: uppercase; color: #e5402f;
  }
  .eyebrow .jp {
    font-family: "Dela Gothic One", sans-serif; font-size: 12px;
    letter-spacing: .1em;
  }
  .eyebrow .sep { padding: 0 8px; color: rgba(18,16,31,.35); }

  h1 {
    margin-top: 18px;
    font-family: "Archivo Black", sans-serif; font-weight: 400;
    font-size: 112px; line-height: .81; letter-spacing: -.055em;
    text-transform: uppercase;
  }
  h1 .dot { color: #e5402f; }

  .jp-strip {
    display: inline-block; align-self: flex-start;
    margin-top: 24px; padding: 7px 12px 9px;
    background: #ffd23f; color: #12101f;
    border: 1.5px solid #12101f;
    box-shadow: 5px 5px 0 #e5402f;
    font-family: "Dela Gothic One", sans-serif;
    font-size: 18px; letter-spacing: .07em;
    transform: rotate(-1.2deg);
  }

  .meta {
    margin-top: 20px;
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: rgba(18,16,31,.62);
  }
  .meta span { color: #e5402f; padding: 0 5px; }

  .foot {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid rgba(18,16,31,.22);
    display: flex; align-items: flex-end; justify-content: space-between; gap: 24px;
  }
  .quote {
    max-width: 330px;
    font-size: 25px; font-weight: 500; line-height: 1.08;
    letter-spacing: -.035em;
  }
  .credit {
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 9px; line-height: 1.6; letter-spacing: .14em;
    text-transform: uppercase; text-align: right;
    color: rgba(18,16,31,.56);
  }
</style>
</head>
<body>
  <div class="art"><img src="../assets/img/notes-city.svg" alt=""></div>
  <div class="divider"></div>
  <div class="edge"></div>

  <div class="copy">
    <div class="brand">
      <img src="../assets/img/hamamatsu-mark.svg" width="46" height="46" alt="">
      <span class="brand__name">Project Hamamatsu</span>
      <span class="brand__rule"></span>
      <span class="brand__album">Summer Avenue</span>
    </div>

    <p class="eyebrow"><span class="jp">シティ・ポップ</span><span class="sep">/</span>CITY POP<span class="sep">/</span>2026</p>
    <h1>SUMMER<br>AVENUE<span class="dot">.</span></h1>
    <div class="jp-strip">サマー・アベニュー</div>
    <p class="meta">11 TRACKS <span>·</span> 46:05 <span>·</span> RB–001</p>

    <div class="foot">
      <p class="quote">For the long way home.</p>
      <p class="credit">Project Hamamatsu<br>City pop · 2026</p>
    </div>
  </div>
</body>
</html>
