      <stop offset=".28" stop-color="#ffb45f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff7a42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38243c"/>
      <stop offset=".35" stop-color="#241730"/>
      <stop offset="1" stop-color="#120d1d"/>
    </linearGradient>
    <linearGradient id="walk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2841"/>
      <stop offset="1" stop-color="#1c1328"/>
    </linearGradient>
    <linearGradient id="shadeLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080510" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#080510" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="shadeRight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080510" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#080510" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="44%" r="76%">
      <stop offset=".5" stop-color="#09060f" stop-opacity="0"/>
      <stop offset="1" stop-color="#09060f" stop-opacity=".5"/>
    </radialGradient>
    <pattern id="winA" width="46" height="58" patternUnits="userSpaceOnUse">
      <rect width="46" height="58" fill="#1d132b"/>
      <rect x="9" y="12" width="20" height="26" fill="#ffcb70" opacity=".78"/>
      <rect x="9" y="12" width="20" height="8" fill="#fff0ba" opacity=".35"/>
    </pattern>
    <pattern id="winB" width="38" height="52" patternUnits="userSpaceOnUse">
      <rect width="38" height="52" fill="#241735"/>
      <rect x="7" y="11" width="16" height="22" fill="#ffb765" opacity=".62"/>
      <rect x="7" y="11" width="16" height="6" fill="#ffe6ac" opacity=".25"/>
    </pattern>
    <pattern id="winC" width="52" height="64" patternUnits="userSpaceOnUse">
