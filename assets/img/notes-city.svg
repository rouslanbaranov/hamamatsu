<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" role="img" aria-labelledby="title desc">
  <title id="title">Neon city avenue at dusk</title>
  <desc id="desc">An anime-style illustration of a wide city avenue at dusk: a huge setting sun, utility wires, glowing signs, and buildings receding toward the horizon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#110c22"/>
      <stop offset=".30" stop-color="#24163d"/>
      <stop offset=".46" stop-color="#4b2350"/>
      <stop offset=".58" stop-color="#963b57"/>
      <stop offset=".68" stop-color="#e8654f"/>
      <stop offset=".78" stop-color="#ffb36b"/>
      <stop offset="1" stop-color="#ffcf8a"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#fff3c2"/>
      <stop offset=".55" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9a5a"/>
    </radialGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#ffcf82" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ff8a5c" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow">
